const $=id=>document.getElementById(id);
let active=null,activeGame=null;
function decode(s){let raw=atob(s);let bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes);}
function setScreen(name){['overview','topic-screen','game-screen'].forEach(id=>$(id).hidden=id!==name);$('back-mission').hidden=name!=='overview';window.scrollTo({top:0,behavior:'instant'});}
function resizeFrame(frame,prop){try{let h=frame.contentDocument.documentElement.scrollHeight||0;if(h>100&&Math.abs(frame.offsetHeight-h)>4)frame.style.height=Math.min(frame.id==='game-frame'?2200:12000,Math.max(360,h+18))+'px';}catch(e){}}
window.addEventListener('message',e=>{if(e.source===$('lesson-frame').contentWindow&&e.data&&e.data.efLessonHeight){$('lesson-frame').style.height=Math.min(12000, Math.max(300, Number(e.data.efLessonHeight)+18))+'px';}if(e.source===$('game-frame').contentWindow&&e.data&&e.data.efGameHeight){$('game-frame').style.height=Math.min(2200, Math.max(360, Number(e.data.efGameHeight)+18))+'px';}});
$('lesson-frame').addEventListener('load',()=>resizeFrame($('lesson-frame')));
$('game-frame').addEventListener('load',()=>resizeFrame($('game-frame')));
function make(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function openTopic(id,writeHash=true){const t=TOPICS.find(x=>x.id===id);if(!t)return;active=t;activeGame=null;setScreen('topic-screen');$('topic-title').textContent=t.title;$('topic-focus').textContent=t.focus;
$('topic-notice').hidden=!t.note;$('topic-notice').textContent=t.note||'';
$('lesson-wrap').hidden=!t.hasSource;
const frame=$('lesson-frame');frame.style.height='320px';frame.removeAttribute('src');frame.srcdoc=t.hasSource?decode(ASSETS[id].lesson):'';
const grid=$('pickles');grid.replaceChildren();
for(let i=0;i<t.pickles.length;i++){let p=t.pickles[i];const card=make('div','pickle');card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label','Start Pickle '+(i+1)+': '+p.name);card.append(make('span',null,'🥒 PICKLE '+(i+1)),make('h3',null,p.name),make('p','source',p.source && p.source.includes('Nieuwe')?'10 willekeurige vragen uit 150':'EngliForce-oefening'));let a=make('button','achieved','ACHIEVED');a.type='button';a.setAttribute('aria-pressed','false');let key='m2_t2_grammar_'+id+'_p'+i;try{a.setAttribute('aria-pressed',localStorage.getItem(key)==='yes'?'true':'false');}catch(e){}a.addEventListener('click',ev=>{ev.stopPropagation();const on=a.getAttribute('aria-pressed')!=='true';a.setAttribute('aria-pressed',String(on));try{localStorage.setItem(key,on?'yes':'no');}catch(e){}});card.append(a);const go=()=>openPickle(i);card.addEventListener('click',e=>{if(e.target.closest('.achieved'))return;go();});card.addEventListener('keydown',e=>{if(e.target!==card)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});grid.append(card);}
if(writeHash)history.replaceState(null,'','#'+id);
}
function openPickle(index){let item=ASSETS[active.id].pickles[index];activeGame={index,item};setScreen('game-screen');$('game-title').textContent='🥒 PICKLE '+(index+1)+' · '+item.name;$('game-info').textContent='Onderwerp: '+active.title;$('back-topic').textContent='← TERUG NAAR '+active.title.toUpperCase();
$('external-disclaimer').hidden=item.type!=='external';$('game-wrap').hidden=item.type==='external';let f=$('game-frame');f.removeAttribute('src');f.srcdoc='';f.style.height='500px';if(item.type==='local'){f.srcdoc=decode(item.content);$('game-wrap').hidden=false;}
}
$('start-external').addEventListener('click',()=>{const a=activeGame?.item;if(!a||a.type!=='external')return;$('external-disclaimer').hidden=true;$('game-wrap').hidden=false;let f=$('game-frame');f.style.height='650px';f.srcdoc='';f.src=a.url;f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');});
$('back-topic').addEventListener('click',()=>{const f=$('game-frame');f.srcdoc='';f.removeAttribute('src');openTopic(active.id,false);});
$('back-topics').addEventListener('click',()=>{location.href='m2t2_grammar.html';});
const icons=['🍂','❄️','🌸','☀️','🎉'];TOPICS.forEach((t,i)=>{let b=make('button','topic'+(t.hasSource?'':' missing'));b.type='button';b.append(make('span',null,icons[i]),make('strong',null,t.title),make('span',null,t.focus));if(!t.hasSource)b.append(make('em',null,'Bronmateriaal ontbreekt'));b.addEventListener('click',()=>openTopic(t.id));$('topics').append(b);});
openTopic(TOPICS[0].id,false);
</script></body></html>
