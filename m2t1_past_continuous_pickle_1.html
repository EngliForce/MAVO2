            text-align: center;

            letter-spacing: 3px;
            margin: 0;
            text-shadow: 4px 4px 0px var(--hero-orange-dark);
        }

        header p {
            font-size: 1.2rem;
            margin-top: 5px;
            font-weight: bold;
            color: #fff;
        }

        #start-screen, #game-screen {
            display: none;
            padding: 2rem;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        #start-screen.active, #game-screen.active {
            display: block;
            animation: fadeIn 0.4s ease-out;
        }

            display: inline-block;
            text-align: center;
            margin: 1rem;
            background: rgba(26, 16, 42, 0.9);
            border: 2px solid var(--hero-blue);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);

            font-family: 'Bangers', cursive;
            color: var(--hero-yellow);
            font-size: 2rem;
            margin: 0 0 10px 0;
        }

            font-size: 2.5rem;
            border: 3px solid transparent;
            border-radius: 12px;
            margin: 0.3rem;
            padding: 0.4rem;
            cursor: pointer;
            display: inline-block;
            transition: transform 0.2s, border-color 0.2s;
        }

        .character-option:hover {
            transform: scale(1.2);
        }

        .character-option.selected {
            border-color: var(--hero-yellow);
            background-color: rgba(255, 183, 3, 0.2);
        }

            color: white;
            outline: none;
            box-sizing: border-box;

        }

            background: var(--hero-purple-main);
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 50px;
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s;
            border-bottom: 5px solid var(--hero-purple-dark);
            margin-top: 1rem;
        }

        button:hover:enabled {
            transform: translateY(-3px);
            background: var(--hero-blue);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        #game-container {

            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            padding: 1rem;

</head>

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function createExplosion(e, message) {
        const x = e ? e.clientX : window.innerWidth / 2;
        const y = e ? e.clientY : window.innerHeight / 2;
        const flash = document.getElementById('flash');
        flash.style.opacity = '0.3';
        setTimeout(() => flash.style.opacity = '0', 200);
        
        const txt = document.createElement('div');
        txt.className = 'boom-text';
        txt.innerText = message || 'BOOM!';
        txt.style.left = (x - 50) + 'px'; 
        txt.style.top = (y - 50) + 'px';
        document.body.appendChild(txt);
        setTimeout(() => txt.remove(), 600);
    }

    function selectCharacter(player, emoji) {
        playerChars[player - 1] = emoji;
        const container = document.getElementById(`char${player}-options`);
        Array.from(container.children).forEach(c => c.classList.remove('selected'));
        Array.from(container.children).forEach(c => {
            if (c.textContent === emoji) c.classList.add('selected');
        });
    }

        document.getElementById('charDisplay2').textContent = playerChars[1];

        document.getElementById('start-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');

        createExplosion(e, 'START!');
        updateQuestion();
    }

    function updateQuestion() {
        document.getElementById('turn-indicator').textContent =
            `Turn: ${playerNames[currentPlayer - 1]}`;
        document.getElementById('question').textContent =
            questions[currentQuestion].sentence;
        document.getElementById('answer').value = "";

        const feedback = document.getElementById('feedback');
        feedback.textContent = "";
        feedback.classList.remove('correct', 'incorrect');

        const submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = false;
        document.getElementById('answer').focus();
    }

    function normalizeSpaces(str) {
        return str.replace(/\s+/g, ' ').trim();
    }

    function expandContractions(str) {
        return str
            .replace(/\bwasn't\b/gi, "was not")
            .replace(/\bweren't\b/gi, "were not")
            .replace(/(^|\s)'m\b/gi, "$1am")
            .replace(/(^|\s)'re\b/gi, "$1are")
            .replace(/(^|\s)'s\b/gi, "$1is");
    }

    function stripPronoun(str) {
        const pronouns = ["I", "You", "He", "She", "It", "We", "They",
                          "i", "you", "he", "she", "it", "we", "they"];
        for (const p of pronouns) {
            if (str.startsWith(p + " ")) {
                return str.slice(p.length + 1);
            }
        }
        return str;
    }

    function isCorrect(userInputRaw, expectedRaw) {
        const expected = normalizeSpaces(expectedRaw);
        let user = normalizeSpaces(userInputRaw);

        if (!user) return false;

        // Exact match (case sensitive)
        if (user === expected) return true;

        // Afkortingen / voluit (case-insensitive fallback)
        if (user.toLowerCase() === expected.toLowerCase()) return true;

        user = expandContractions(user);
        user = normalizeSpaces(user);
        if (user.toLowerCase() === expected.toLowerCase()) return true;

        user = stripPronoun(user);
        user = normalizeSpaces(user);
        if (user.toLowerCase() === expected.toLowerCase()) return true;

        return false;
    }

    function submitAnswer(e) {
        const submitBtn = document.getElementById('submit-btn');
        if (submitBtn.disabled) return;
        submitBtn.disabled = true;

        const rawInput = document.getElementById("answer").value;
        const feedback = document.getElementById("feedback");
        const correctAnswer = questions[currentQuestion].answer;

        feedback.classList.remove('correct', 'incorrect');

        const right = isCorrect(rawInput, correctAnswer);

        if (right) {
            const target = currentPlayer === 1 ? 2 : 1;
            damage[target]++;
            updateDamage(target);
            createExplosion(e, 'HIT!');
            feedback.textContent = `💥 CRITICAL HIT! Your answer: "${rawInput.trim()}"`;
            feedback.classList.add('correct');
        } else {
            const shownCorrect = correctAnswer;
            const shownInput = rawInput.trim() || "—";
            createExplosion(e, 'MISS!');
            feedback.textContent =
                `🛡️ MISSED!\nYour answer: "${shownInput}".\nCorrect answer: "${shownCorrect}".`;
            feedback.classList.add('incorrect');
        }

        // Win check
        if (damage[1] >= 10 || damage[2] >= 10) {
            const winner = damage[1] >= 10 ? playerNames[0] : playerNames[1];
            setTimeout(() => {
                createExplosion(null, 'VICTORY!');
                alert(`🏆 ${winner} WINS THE BATTLE!`);
                location.reload();
            }, 1200);
            return;
        }

        // Pauze voor volgende vraag
        setTimeout(() => {
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            currentQuestion = (currentQuestion + 1) % questions.length;
            updateQuestion();
        }, 2000);
    }

    function updateDamage(player) {
        document.getElementById(`damage${player}`).textContent =
            `Damage: ${damage[player]}/10`;
        const display = document.getElementById(`charDisplay${player}`);
        display.style.opacity = `${1 - damage[player] * 0.08}`;
    }
</script>
