    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Space+Mono&display=swap');
        
        body { 
            font-family: 'Space Mono', monospace; 
            background-color: #020617; 
            color: #f8fafc; 
            overflow: hidden; 
            height: 100vh;
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: moveStars 25s linear infinite;
        }
        @keyframes moveStars {
            from { transform: translateY(0); }
            to { transform: translateY(100vh); }
        }
        .nebula-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.15);
        }
        .large-input {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #334155;
            border-bottom: 4px solid #22d3ee;
            color: #22d3ee;
            outline: none;
            text-align: center;
            width: 100%;
            max-width: 650px;
            padding: 20px;
            font-size: 2.5rem;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .large-input:focus {
            border-color: #22d3ee;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.2);
        }
        .landed-anim {
            animation: landing 1s ease-out forwards;
        }
        @keyframes landing {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>

            const [correctCount, setCorrectCount] = useState(0);
            const [wrongCount, setWrongCount] = useState(0);
            const [remainingWords, setRemainingWords] = useState([]);
            const [currentQ, setCurrentQ] = useState(null);
            const [input, setInput] = useState("");
            const [feedback, setFeedback] = useState(null);

            const totalQuestions = 10;

            const startMission = (cat) => {
                setCategory(cat);
                let selectedList = [];

                if (cat === 'MIXED') {
                    selectedList = [
                        ...MASTER_DATABASE.AFFIRMATIVE,
                        ...MASTER_DATABASE.NEGATIVE,
                        ...MASTER_DATABASE.QUESTIONS
                    ];
                } else {
                    selectedList = MASTER_DATABASE[cat];
                }

                const shuffled = [...selectedList].sort(() => Math.random() - 0.5).slice(0, totalQuestions);
                
                setDistance(0); 
                setCorrectCount(0); 
                setWrongCount(0);
                setRemainingWords(shuffled.slice(1));
                setCurrentQ(shuffled[0]); 
                setInput(""); 
                setFeedback(null);
                setPhase('GAME');
            };

            const handleAnswer = () => {
                if (!input.trim() || feedback) return;
                const userInput = input.toLowerCase().trim().replace(/’/g, "'");
                const isCorrect = userInput === currentQ.full.toLowerCase() || userInput === currentQ.short.toLowerCase();

                if (isCorrect) {
                    setFeedback('SUCCESS');
                    setDistance(d => d + 12500);
                    setTimeout(() => {
                        const nextCount = correctCount + 1;
                        setCorrectCount(nextCount);
                        if (nextCount >= totalQuestions) setPhase('SUMMARY');
                        else {
                            setCurrentQ(remainingWords[0]);
                            setRemainingWords(remainingWords.slice(1));
                            setFeedback(null); 
                            setInput("");
                        }
                    }, 1000);
                } else {
                    setFeedback('FAIL');
                    setWrongCount(w => w + 1);
                    setTimeout(() => setFeedback(null), 2500);
                }
            };

            return (

                                >

                                    <div className="text-xl font-bold text-white group-hover:text-black">Affirmative</div>
                                    <div className="text-xs text-slate-400 group-hover:text-black/70 mt-2">50 Targets (was/were + ing)</div>
                                </button>

                                    onClick={() => startMission('NEGATIVE')} 
                                    className="p-6 border-2 border-pink-500 bg-slate-900/80 hover:bg-pink-500 hover:text-black orbitron rounded-2xl transition-all uppercase tracking-wider group text-left"

                                    <div className="text-xs text-slate-400 group-hover:text-black/70 mt-2">50 Targets (wasn't/weren't)</div>
                                </button>

                                    onClick={() => startMission('QUESTIONS')} 
                                    className="p-6 border-2 border-amber-500 bg-slate-900/80 hover:bg-amber-500 hover:text-black orbitron rounded-2xl transition-all uppercase tracking-wider group text-left"
                                >
                                    <div className="text-xs text-amber-400 group-hover:text-black mb-2">Sector 03</div>
                                    <div className="text-xl font-bold text-white group-hover:text-black">Questions</div>
                                    <div className="text-xs text-slate-400 group-hover:text-black/70 mt-2">50 Targets (Was/Were...?)</div>
                                </button>

                                <button 
                                    onClick={() => startMission('MIXED')} 
                                    className="p-6 border-2 border-purple-500 bg-slate-900/80 hover:bg-purple-500 hover:text-black orbitron rounded-2xl transition-all uppercase tracking-wider group text-left"
                                >
                                    <div className="text-xs text-purple-400 group-hover:text-black mb-2">Sector 04</div>
                                    <div className="text-xl font-bold text-white group-hover:text-black">Mixed</div>
                                    <div className="text-xs text-slate-400 group-hover:text-black/70 mt-2">Random 150 Targets</div>
                                </button>
                            </div>
                        </div>
                    )}

                    {phase === 'GAME' && (
                        <div className="z-10 w-full max-w-6xl p-16 rounded-3xl nebula-panel">
                            {/* PROGRESS BAR */}
                            <div className="w-full bg-slate-800 h-3 rounded-full mb-12 overflow-hidden border border-slate-700">
                                <div 
                                    className="h-full bg-gradient-to-r from-cyan-600 to-cyan-400 transition-all duration-700"
                                    style={{ width: `${(correctCount / totalQuestions) * 100}%` }}
                                ></div>
                            </div>

                            <div className="flex justify-between items-center mb-16 orbitron">
                                <span className="text-cyan-400 text-sm tracking-widest">
                                    SECTOR: {category} // TARGET {correctCount + 1} OF {totalQuestions}
                                </span>
                                <span className="text-3xl font-bold text-white tracking-tighter">{distance.toLocaleString()} KM</span>
                            </div>

                            {!feedback ? (
                                <div className="text-center">
                                    {/* VERB CALIBRATION */}
                                    <div className="mb-10">
                                        <div className="text-xs uppercase text-slate-500 tracking-[0.6em] mb-4">Calibration Target:</div>
                                        <div className="text-4xl md:text-5xl font-bold orbitron text-cyan-400 border-b-2 border-cyan-900 inline-block pb-2">
                                            ({currentQ?.verb.toUpperCase()})
                                        </div>
                                    </div>

                                    {/* DE ZIN */}
                                    <div className="text-4xl md:text-5xl font-bold orbitron text-white mb-16 leading-relaxed opacity-90 italic">
                                        {currentQ?.start} <span className="text-cyan-700 underline decoration-dotted underline-offset-8">_______</span> {currentQ?.end}
                                    </div>

                                    <div className="flex justify-center">
                                        <input 
                                            className="large-input orbitron"
                                            value={input}
                                            onChange={(e) => setInput(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && handleAnswer()}
                                            autoFocus
                                            spellCheck="false"
                                            autoComplete="off"
                                        />
                                    </div>
                                </div>
                            ) : (
                                <div className="text-center py-12">
                                    <h2 className={`text-6xl font-bold orbitron mb-10 ${feedback === 'SUCCESS' ? 'text-cyan-400' : 'text-red-500'}`}>
                                        {feedback === 'SUCCESS' ? 'WARP SUCCESS' : 'SYSTEM OVERLOAD'}
                                    </h2>
                                    {feedback === 'FAIL' && (
                                        <div className="bg-red-950/30 p-8 rounded-2xl border border-red-900 inline-block">
                                            <p className="text-slate-400 text-xs uppercase mb-2">Required Sequence:</p>
                                            <p className="text-5xl text-white font-bold italic tracking-tighter">"{currentQ.full}"</p>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    )}

                    {phase === 'SUMMARY' && (
                        <div className="z-10 w-full max-w-4xl p-16 rounded-3xl nebula-panel text-center landed-anim border-b-4 border-b-cyan-500">
                            <h1 className="text-8xl font-bold text-white orbitron mb-4 uppercase tracking-tighter">Mission Clear</h1>
                            <p className="text-cyan-400 orbitron text-xl mb-12 tracking-[0.3em]">SECTOR {category} PURGED</p>

                            <div className="grid grid-cols-2 gap-8 mb-16">
                                <div className="bg-slate-900/80 p-10 rounded-3xl border border-slate-800">
                                    <div className="text-slate-500 text-xs uppercase tracking-widest mb-4">Final Distance</div>
                                    <div className="text-5xl text-yellow-400 orbitron tracking-tighter">{distance.toLocaleString()} KM</div>
                                </div>
                                <div className="bg-slate-900/80 p-10 rounded-3xl border border-slate-800">
                                    <div className="text-slate-500 text-xs uppercase tracking-widest mb-4">Hull Integrity</div>
                                    <div className="text-5xl text-white orbitron tracking-tighter">{Math.max(0, 100 - (wrongCount * 10))}%</div>
                                </div>
                            </div>

                            <button onClick={() => setPhase('INTRO')} className="px-24 py-8 bg-white text-black text-2xl font-bold orbitron rounded-full hover:bg-cyan-400 hover:text-black transition-all uppercase tracking-widest shadow-2xl">
                                Select New Sector
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
