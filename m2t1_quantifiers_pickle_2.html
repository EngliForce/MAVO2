        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'beep') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'penalty') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'defused') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.15);
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.6);
                } else if (type === 'explode') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(100, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(20, ctx.currentTime + 0.8);
                    gain.gain.setValueAtTime(0.4, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.8);
                }
            } catch (e) { }
        };

        const triggerConfetti = () => {
            if (window.confetti) {
                confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 }, colors: ['#ff7043', '#ffb703', '#ffffff'] });
            } else {
                const canvas = document.createElement('canvas');
                canvas.style.position = 'fixed';
                canvas.style.top = '0';
                canvas.style.left = '0';
                canvas.style.width = '100vw';
                canvas.style.height = '100vh';
                canvas.style.pointerEvents = 'none';
                canvas.style.zIndex = '9999';
                document.body.appendChild(canvas);

                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                const particles = [];
                const colors = ['#22c55e', '#3b82f6', '#eab308', '#ec4899', '#a855f7'];

                for (let i = 0; i < 120; i++) {
                    particles.push({
                        x: canvas.width / 2,
                        y: canvas.height / 2,
                        vx: (Math.random() - 0.5) * 18,
                        vy: (Math.random() - 0.7) * 18,
                        size: Math.random() * 8 + 4,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        life: 1,
                        decay: Math.random() * 0.015 + 0.01
                    });
                }

                const animate = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    let alive = false;
                    particles.forEach(p => {
                        if (p.life > 0) {
                            alive = true;
                            p.x += p.vx;
                            p.y += p.vy;
                            p.vy += 0.3;
                            p.life -= p.decay;
                            ctx.fillStyle = p.color;
                            ctx.globalAlpha = Math.max(0, p.life);
                            ctx.fillRect(p.x, p.y, p.size, p.size);
                        }
                    });
                    if (alive) requestAnimationFrame(animate);
                    else canvas.remove();
                };
                animate();
            }
        };

                setCorrectCount(0);
                setCurrentIdx(0);
                setWrongAnswersList([]);
                setInput("");
                setFeedbackState(null);
            };

            useEffect(() => {
                if (phase === 'GAME' && status === 'ACTIVE' && !feedbackState) {
                    timerRef.current = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                setStatus("EXPLODED");
                                playSound('explode');
                                return 0;
                            }
                            if (prev % 5 === 0) playSound('beep');
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(timerRef.current);
            }, [phase, status, feedbackState]);

            useEffect(() => {
                if (phase === 'GAME' && status === 'ACTIVE' && !feedbackState && inputRef.current) {
                    inputRef.current.focus();
                }
            }, [phase, status, currentIdx, feedbackState]);

            const evaluateAnswer = (selectedVal) => {
                if (feedbackState) return;
                const val = (selectedVal || input).toLowerCase().trim();
                if (!val) return;

                const currentQ = questions[currentIdx];
                
                if (val === currentQ.ans) {
                    playSound('beep');
                    setFeedbackState({ type: 'CORRECT', given: val, correct: currentQ.ans });

                    setTimeout(() => {
                        const nextCorrect = correctCount + 1;
                        setCorrectCount(nextCorrect);

                        if (nextCorrect > highScore) {
                            setHighScore(nextCorrect);
                            localStorage.setItem('bomb_squad_highscore', nextCorrect.toString());
                        }

                        if (nextCorrect >= TARGET_COUNT) {
                            setStatus("DEFUSED");
                            playSound('defused');
                            triggerConfetti();
                        } else {
                            setCurrentIdx(prev => prev + 1);
                            setInput("");
                        }
                        setFeedbackState(null);
                    }, 900);

                } else {
                    playSound('penalty');

                        ...prev, 
                        { sentence: `${currentQ.start} [ ... ] ${currentQ.end}`, given: val, correct: currentQ.ans }
                    ]);

                    setTimeLeft(prev => {
                        const newTime = prev - 60;
                        if (newTime <= 0) {
                            setStatus("EXPLODED");
                            playSound('explode');
                            return 0;
                        }
                        return newTime;
                    });
                    
                    setShowPenalty(true);
                    setTimeout(() => setShowPenalty(false), 900);

                    setFeedbackState({ type: 'WRONG', given: val, correct: currentQ.ans });

                    setTimeout(() => {
                        setInput("");
                        setFeedbackState(null);
                        if (status === 'ACTIVE') {
                            setCurrentIdx(prev => prev + 1);
                        }
                    }, 1500);
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') {

                }
            };

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const calculateStars = () => {
                const mistakesCount = wrongAnswersList.length;
                if (mistakesCount === 0 && timeLeft > 180) return 3;
                if (mistakesCount <= 2) return 2;
                return 1;
            };

            const options = ["much", "many", "little", "few", "a little", "a few"];

            return (
                <main className={`transition-all duration-500 ${
                    status === 'EXPLODED' && timeLeft === 0 ? 'bg-red-950' : status === 'DEFUSED' ? 'bg-emerald-950' : ''
                }`}>
                    
                    {/* START SCREEN */}
                    {phase === 'START' && (
                        <div className="text-center p-8 md:p-12 bomb-panel rounded-3xl border-red-900/60 max-w-xl w-full">
                            <div className="inline-block bg-red-950/80 border border-red-600/50 text-red-400 text-xs px-3 py-1 rounded-full uppercase tracking-widest mb-4 font-semibold">
                                Tactical Grammar Op
                            </div>
                            <h1 className="text-4xl md:text-5xl font-black mb-3 lcd-text tracking-tighter text-red-500 font-orbitron">
                                BOMB SQUAD
                            </h1>
                            <p className="text-sm md:text-base mb-6 text-zinc-400 uppercase tracking-[0.25em]">
                                Quantifiers Protocol
                            </p>

                            <div className="bg-zinc-900/80 p-4 rounded-xl border border-zinc-800 mb-6 text-left text-xs text-zinc-300 space-y-2">
                                <div className="flex justify-between border-b border-zinc-800 pb-2">
                                    <span className="text-zinc-500">WIRES (OPTIONS):</span>
                                    <span className="text-red-400 font-bold">much | many | little | few | a little | a few</span>
                                </div>
                                <div className="flex justify-between border-b border-zinc-800 pb-2">
                                    <span className="text-zinc-500">FEEDBACK:</span>
                                    <span className="text-emerald-400 font-bold">Direct Goed/Fout + Overzicht</span>
                                </div>
                                <div className="flex justify-between">
                                    <span className="text-zinc-500">PENALTY:</span>
                                    <span className="text-red-500 font-bold">-60 sec per fout antwoord</span>
                                </div>
                            </div>

                            {highScore > 0 && (
                                <div className="mb-6 bg-amber-950/40 border border-amber-600/40 text-amber-400 py-2 px-4 rounded-xl text-sm font-semibold flex items-center justify-center gap-2">
                                    <span>🏆 HIGHEST STABILITY RECORD:</span>
                                    <span className="text-lg font-bold">{highScore} / {TARGET_COUNT}</span>
                                </div>
                            )}

                            <button 
                                onClick={startMission} 
                                className="w-full py-5 border-2 border-red-600 text-red-500 hover:bg-red-600 hover:text-white transition-all text-xl font-bold font-orbitron tracking-wider rounded-xl shadow-lg cursor-pointer"
                            >
                                INITIATE DISPOSAL
                            </button>
                        </div>
                    )}

                    {/* GAMEPLAY SCREEN */}
                    {phase === 'GAME' && status === 'ACTIVE' && (
                        <div className={`w-full max-w-4xl p-6 md:p-12 bomb-panel rounded-3xl relative ${showPenalty ? 'flash-red' : ''}`}>
                            
                            {/* TOP STATUS BAR */}
                            <div className="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 border-b border-zinc-800 pb-6">
                                <div className="relative text-center md:text-left">
                                    <div className="flex items-center gap-2">
                                        <div className="text-xs text-zinc-500 uppercase tracking-widest">Detonation Timer</div>
                                        <div className="bg-red-950 text-red-400 text-[10px] px-2 py-0.5 rounded border border-red-800 font-bold animate-pulse">
                                            LIVE TIMER
                                        </div>
                                    </div>
                                    <div className="text-6xl md:text-7xl font-bold lcd-text tabular-nums tracking-wider text-red-500 font-orbitron">
                                        {formatTime(timeLeft)}
                                    </div>
                                    {showPenalty && (
                                        <span className="penalty-badge text-3xl text-red-500 font-black absolute top-2 right-[-60px]">
                                            -1:00
                                        </span>
                                    )}
                                </div>

                                <div className="flex md:flex-col items-center md:items-end justify-between w-full md:w-auto">
                                    <div className="text-xs text-zinc-500 uppercase tracking-widest mb-1">Stability Progress</div>
                                    <div className="text-4xl md:text-5xl font-bold text-sky-400 font-orbitron">
                                        {correctCount}<span className="text-zinc-600 text-2xl">/{TARGET_COUNT}</span>
                                    </div>
                                    {highScore > 0 && (
                                        <div className="text-[11px] text-amber-500 mt-1">BEST: {highScore}</div>
                                    )}
                                </div>
                            </div>

                            {/* PROGRESS BAR */}
                            <div className="h-3 w-full bg-zinc-950 rounded-full mb-10 overflow-hidden border border-zinc-800 p-0.5">
                                <div 
                                    className="h-full bg-red-600 rounded-full shadow-[0_0_12px_rgba(220,38,38,0.8)] transition-all duration-500" 
                                    style={{ width: `${(timeLeft / INITIAL_TIME) * 100}%` }}
                                ></div>
                            </div>

                            {/* QUESTION DISPLAY */}
                            <div className="text-center mb-8 min-h-[120px] flex flex-col justify-center items-center">
                                <div className="text-2xl md:text-4xl font-bold text-zinc-100 leading-snug max-w-2xl">
                                    {questions[currentIdx]?.start}{' '}
                                    <span className={`inline-block border-b-4 px-3 bg-zinc-900/60 rounded transition-colors ${
                                        feedbackState?.type === 'CORRECT' ? 'border-emerald-500 text-emerald-400' :
                                        feedbackState?.type === 'WRONG' ? 'border-red-500 text-red-400' :
                                        'border-red-500 text-red-400'
                                    }`}>
                                        {input || "_______"}
                                    </span>{' '}
                                    {questions[currentIdx]?.end}
                                </div>

                                {/* DIRECT FEEDBACK NOTIFICATION */}
                                {feedbackState && (
                                    <div className="mt-4 animate-bounce">
                                        {feedbackState.type === 'CORRECT' ? (
                                            <span className="bg-emerald-950 border border-emerald-500 text-emerald-400 text-sm font-bold px-4 py-1.5 rounded-full uppercase tracking-wider shadow-lg">
                                                ✔ GOED!
                                            </span>
                                        ) : (
                                            <div className="bg-red-950/90 border border-red-500 text-red-300 text-sm font-bold px-4 py-2 rounded-xl uppercase tracking-wider shadow-lg flex flex-col gap-1">
                                                <div>✖ FOUT! (Jouw antwoord: "{feedbackState.given}")</div>
                                                <div className="text-emerald-400 font-normal normal-case text-xs">
                                                    Juiste antwoord: <span className="font-bold underline">{feedbackState.correct}</span>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>

                            {/* INPUT AND WIRE BUTTON CONTROLS */}
                            <div className="space-y-6">
                                <div className="flex gap-2 max-w-md mx-auto">
                                    <input
                                        ref={inputRef}
                                        type="text"
                                        value={input}
                                        disabled={feedbackState !== null}
                                        onChange={(e) => setInput(e.target.value)}
                                        onKeyDown={handleKeyDown}
                                        placeholder="Type or click wire..."
                                        className="flex-1 bg-zinc-900 border-2 border-zinc-700 focus:border-red-500 text-zinc-100 px-4 py-3 rounded-xl outline-none font-bold text-lg text-center tracking-wide transition-colors"
                                    />
                                    <button
                                        onClick={() => evaluateAnswer()}
                                        disabled={feedbackState !== null}
                                        className="bg-red-600 hover:bg-red-500 active:bg-red-700 text-white font-bold px-6 py-3 rounded-xl font-orbitron tracking-wider transition-colors shadow-lg cursor-pointer"
                                    >
                                        CUT
                                    </button>
                                </div>

                                <div className="grid grid-cols-2 md:grid-cols-3 gap-3 pt-2">
                                    {options.map((opt) => (
                                        <button
                                            key={opt}
                                            onClick={() => evaluateAnswer(opt)}
                                            disabled={feedbackState !== null}
                                            className="wire-btn bg-zinc-900 border-2 border-zinc-700 hover:border-red-500 hover:bg-zinc-800 text-zinc-200 font-bold py-3 px-4 rounded-xl text-center text-sm md:text-base tracking-wider transition-all cursor-pointer"
                                        >
                                            ✂️ {opt}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* DEFUSED (VICTORY) OR EXPLODED (DEFEAT) END SCREENS WITH SUMMARY */}
                    {(status === 'DEFUSED' || status === 'EXPLODED') && (
                        <div className="text-center p-6 md:p-10 bomb-panel rounded-3xl max-w-2xl w-full my-8">
                            <div className={`inline-block px-3 py-1 rounded-full uppercase tracking-widest mb-3 text-xs font-semibold ${
                                status === 'DEFUSED' ? 'bg-emerald-950/80 border border-emerald-600/50 text-emerald-400' : 'bg-red-950/80 border border-red-600/50 text-red-400'
                            }`}>
                                {status === 'DEFUSED' ? 'Threat Neutralized' : 'Critical Failure'}
                            </div>

                            <h1 className={`text-4xl md:text-5xl font-black mb-3 font-orbitron tracking-tighter ${
                                status === 'DEFUSED' ? 'lcd-green text-emerald-500' : 'lcd-text text-red-600'
                            }`}>
                                {status === 'DEFUSED' ? 'BOMB DEFUSED!' : 'DETONATED!'}
                            </h1>
                            
                            {status === 'DEFUSED' && (
                                <div className="flex justify-center gap-3 my-4 text-4xl">
                                    {[1, 2, 3].map((star) => (
                                        <span 
                                            key={star} 
                                            className={`transition-all ${star <= calculateStars() ? 'text-amber-400 star-pop' : 'text-zinc-700'}`}
                                            style={{ animationDelay: `${star * 0.2}s` }}
                                        >
                                            ★
                                        </span>
                                    ))}
                                </div>
                            )}

                            <p className="text-zinc-300 mb-6 text-sm">
                                {status === 'DEFUSED' 
                                    ? `Succesvol gestabiliseerd met ${formatTime(timeLeft)} resterend op de klok.` 
                                    : 'Het apparaat is ontploft voordat de missie voltooid kon worden.'}
                            </p>

                            {/* OVERZICHT VAN FOUTE ANTWOORDEN */}
                            <div className="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-4 mb-6 text-left max-h-60 overflow-y-auto">
                                <h3 className="text-xs font-bold uppercase tracking-wider text-zinc-400 mb-3 border-b border-zinc-800 pb-2 flex justify-between">
                                    <span>Overzicht gemaakte fouten:</span>
                                    <span className="text-red-400">{wrongAnswersList.length} fout(en)</span>
                                </h3>

                                {wrongAnswersList.length === 0 ? (
                                    <div className="text-emerald-400 text-sm py-4 text-center font-semibold">
                                        🌟 Geweldig! Je hebt geen enkele fout gemaakt!
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        {wrongAnswersList.map((item, index) => (
                                            <div key={index} className="bg-zinc-950/80 p-3 rounded-xl border border-zinc-800/80 text-xs">
                                                <div className="text-zinc-300 font-medium mb-1">{item.sentence}</div>
                                                <div className="flex gap-4">
                                                    <span className="text-red-400">Jouw antwoord: <strong className="underline">{item.given || 'geen'}</strong></span>
                                                    <span className="text-emerald-400">Goed antwoord: <strong className="underline">{item.correct}</strong></span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <button 
                                onClick={startMission}
                                className={`w-full py-4 font-bold font-orbitron tracking-wider text-base rounded-xl transition-all shadow-lg cursor-pointer ${
                                    status === 'DEFUSED' ? 'bg-emerald-600 hover:bg-emerald-500 text-white' : 'border-2 border-red-600 text-red-500 hover:bg-red-600 hover:text-white'
                                }`}
                            >
                                {status === 'DEFUSED' ? 'NWE DISPOSAL MISSIE' : 'RETRY DISPOSAL'}
                            </button>
                        </div>
                    )}
                </main>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
