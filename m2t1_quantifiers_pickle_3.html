<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Inspector: Quantifiers Protocol</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Lexend:wght@400;700&family=Share+Tech+Mono&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --hero-orange-main: #ff7043;
            --hero-orange-dark: #e65c30;
            --hero-yellow: #ffb703;
            --dark-bg: #0b1a2a;
            --card-bg: #102a43;
            --card-border: #243b53;
        }

        body { 
            font-family: 'Lexend', sans-serif; 
            background: radial-gradient(circle at center, #102a43 0%, #05101a 100%);
            color: #e2e8f0; 
            overflow-x: hidden; 
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .font-bangers { font-family: 'Bangers', cursive; }

        header {
            background: var(--hero-orange-main);
            padding: 2rem 1rem;
            text-align: center;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);
            border-bottom: 5px solid var(--hero-yellow);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            color: white;
        }

        header h1 { 
            font-family: 'Bangers', cursive; 
            font-size: 3.5rem; 
            letter-spacing: 3px; 
            margin: 0; 
            text-shadow: 4px 4px 0px var(--hero-orange-dark); 
        }

        header p { 
            font-size: 1.2rem; 
            font-weight: bold; 
            margin-top: 5px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            font-family: 'Lexend', sans-serif;
            color: #fff;
        }

        .inspector-card {
            background: linear-gradient(145deg, #102a43, #0b1a2a);
            border: 3px solid #243b53;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
        }

        .action-btn {
            transition: all 0.15s ease;
            box-shadow: 0 4px 0 0 rgba(0,0,0,0.4);
            font-family: 'Share Tech Mono', monospace;
        }
        .action-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 0 rgba(0,0,0,0.4);
        }

        .star-pop {
            animation: starPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes starPop {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            80% { transform: scale(1.2) rotate(10deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        footer {
            text-align: center; 
            opacity: 0.6; 
            padding: 30px 0;
            font-family: 'Lexend', sans-serif;
            color: white;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>ENGLIFORCE ACADEMY</h1>
        <p>GRAMMAR INSPECTOR: QUANTIFIERS PROTOCOL</p>
    </header>

    <div id="root"></div>

    <footer>
        <p>&copy; 2026 EngliForce – Make English Your Superpower!</p>
    </footer>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const generateFull150 = () => {
            let baseList = [
                { text: "How much water is in the bottle?", isCorrect: true, correctQuantifier: "much" },
                { text: "How many water is in the bottle?", isCorrect: false, correctQuantifier: "much" },
                { text: "There isn't much sugar in my tea.", isCorrect: true, correctQuantifier: "much" },
                { text: "There isn't many sugar in my tea.", isCorrect: false, correctQuantifier: "much" },
                { text: "How much money do you need?", isCorrect: true, correctQuantifier: "much" },
                { text: "How many money do you need?", isCorrect: false, correctQuantifier: "much" },
                { text: "Too much salt is bad for you.", isCorrect: true, correctQuantifier: "much" },
                { text: "Too many salt is bad for you.", isCorrect: false, correctQuantifier: "much" },
                { text: "We don't have much time left!", isCorrect: true, correctQuantifier: "much" },
                { text: "We don't have many time left!", isCorrect: false, correctQuantifier: "much" },
                { text: "How many people are at the party?", isCorrect: true, correctQuantifier: "many" },
                { text: "How much people are at the party?", isCorrect: false, correctQuantifier: "many" },
                { text: "I don't have many friends in London.", isCorrect: true, correctQuantifier: "many" },
                { text: "I don't have much friends in London.", isCorrect: false, correctQuantifier: "many" },
                { text: "Are there many cars on the road?", isCorrect: true, correctQuantifier: "many" },
                { text: "Are there much cars on the road?", isCorrect: false, correctQuantifier: "many" },
                { text: "There are too many mistakes here.", isCorrect: true, correctQuantifier: "many" },
                { text: "There are too much mistakes here.", isCorrect: false, correctQuantifier: "many" },
                { text: "He speaks very little English.", isCorrect: true, correctQuantifier: "little" },
                { text: "He speaks very a little English.", isCorrect: false, correctQuantifier: "little" },
                { text: "Could I have a little milk in my coffee?", isCorrect: true, correctQuantifier: "a little" },
                { text: "Could I have little milk in my coffee?", isCorrect: false, correctQuantifier: "a little" },
                { text: "Very few students passed the test.", isCorrect: true, correctQuantifier: "few" },
                { text: "Very a few students passed the test.", isCorrect: false, correctQuantifier: "few" },
                { text: "She bought a few apples at the market.", isCorrect: true, correctQuantifier: "a few" },
                { text: "She bought few apples at the market.", isCorrect: false, correctQuantifier: "a few" }
            ];

            let templates = [
                { t: "There is # water available.", q: "much" },
                { t: "There are # books on the shelf.", q: "many" },
                { t: "He has # patience with them.", q: "little" },
                { t: "She has # close friends.", q: "few" },
                { t: "Would you like # sugar?", q: "a little" },
                { t: "I found # good restaurants.", q: "a few" },
                { t: "We don't spend # money on clothes.", q: "much" },
                { t: "I didn't take # photos today.", q: "many" }
            ];

            let list = [...baseList];
            let counter = 1;
            while(list.length < 150) {
                let template = templates[counter % templates.length];
                let isCorrect = (counter % 2 === 0);
                let text = isCorrect ? template.t.replace('#', template.q) : template.t.replace('#', (template.q === 'much' ? 'many' : 'much'));
                list.push({
                    text: text,
                    isCorrect: isCorrect,
                    correctQuantifier: template.q
                });
                counter++;
            }
            return list;
        };

        const ALL_QUESTIONS = generateFull150();

        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'beep') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'success') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.15);
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.6);
                } else if (type === 'fail') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(100, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(20, ctx.currentTime + 0.8);
                    gain.gain.setValueAtTime(0.4, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.8);
                }
            } catch (e) { }
        };

        const triggerConfetti = () => {
            if (window.confetti) {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#ff7043', '#ffb703', '#ffffff'] });
            }
        };

        const App = () => {
            const TOTAL_ROUNDS = 10;

            const [phase, setPhase] = useState('START');
            const [score, setScore] = useState(0);
            const [currentIdx, setCurrentIdx] = useState(0);
            const [status, setStatus] = useState("ACTIVE");
            const [questions, setQuestions] = useState([]);
            const [highScore, setHighScore] = useState(0);
            
            const [inspectStep, setInspectStep] = useState('JUDGE'); 
            const [feedbackState, setFeedbackState] = useState(null); 
            const [wrongAnswersList, setWrongAnswersList] = useState([]);

            useEffect(() => {
                const saved = localStorage.getItem('grammar_inspector_highscore');
                if (saved) setHighScore(parseInt(saved, 10));
            }, []);

            const startMission = () => {
                const shuffled = [...ALL_QUESTIONS].sort(() => Math.random() - 0.5).slice(0, TOTAL_ROUNDS);
                setQuestions(shuffled);
                setPhase('GAME');
                setStatus('ACTIVE');
                setScore(0);
                setCurrentIdx(0);
                setWrongAnswersList([]);
                setInspectStep('JUDGE');
                setFeedbackState(null);
            };

            const handleUserJudge = (userSaysCorrect) => {
                if (feedbackState) return;
                const currentQ = questions[currentIdx];

                if (userSaysCorrect && currentQ.isCorrect) {
                    handleCorrectAnswer();
                } else if (!userSaysCorrect && !currentQ.isCorrect) {
                    playSound('beep');
                    setInspectStep('FIX');
                } else {
                    handleWrongAnswer(userSaysCorrect ? "Sentence incorrectly approved" : "Sentence incorrectly rejected");
                }
            };

            const handleFixSelection = (selectedQuantifier) => {
                if (feedbackState) return;
                const currentQ = questions[currentIdx];

                if (selectedQuantifier === currentQ.correctQuantifier) {
                    handleCorrectAnswer();
                } else {
                    handleWrongAnswer(`Selected: ${selectedQuantifier}, correct was: ${currentQ.correctQuantifier}`);
                }
            };

            const handleCorrectAnswer = () => {
                playSound('beep');
                setScore(prev => prev + 1);
                setFeedbackState({ type: 'CORRECT' });

                proceedToNextStep();
            };

            const handleWrongAnswer = (reason) => {
                playSound('fail');
                const currentQ = questions[currentIdx];
                
                setWrongAnswersList(prev => [
                    ...prev, 
                    { sentence: currentQ.text, reason: reason, correct: currentQ.correctQuantifier }
                ]);

                setFeedbackState({ type: 'WRONG', detail: reason });

                proceedToNextStep();
            };

            const proceedToNextStep = () => {
                setTimeout(() => {
                    setFeedbackState(null);
                    setInspectStep('JUDGE');

                    if (currentIdx + 1 >= TOTAL_ROUNDS) {
                        setStatus("PASSED");
                        playSound('success');
                        triggerConfetti();

                        setScore(prevScore => {
                            if (prevScore > highScore) {
                                setHighScore(prevScore);
                                localStorage.setItem('grammar_inspector_highscore', prevScore.toString());
                            }
                            return prevScore;
                        });
                    } else {
                        setCurrentIdx(prev => prev + 1);
                    }
                }, 1200);
            };

            const calculateStars = () => {
                const mistakesCount = wrongAnswersList.length;
                if (mistakesCount === 0) return 3;
                if (mistakesCount <= 2) return 2;
                return 1;
            };

            const options = ["much", "many", "little", "few", "a little", "a few"];

            return (
                <main>
                    {phase === 'START' && (
                        <div className="text-center p-6 md:p-10 inspector-card rounded-3xl max-w-xl w-full">
                            <div className="inline-block bg-orange-500/20 border border-orange-500 text-orange-400 text-xs px-3 py-1 rounded-full uppercase tracking-widest mb-3 font-semibold">
                                Grammar Inspector Dashboard
                            </div>
                            <h1 className="text-3xl md:text-4xl font-black mb-2 tracking-tighter text-white font-orbitron">
                                INSPECTION PROTOCOL
                            </h1>
                            <p className="text-xs md:text-sm mb-4 text-slate-300 uppercase tracking-[0.15em]">
                                Round of 10 Random Sentences
                            </p>

                            {/* Instructies in eenvoudig Engels (A2 niveau) */}
                            <div className="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 mb-5 text-left text-xs text-slate-200 space-y-2 shadow-inner">
                                <div className="text-orange-400 font-bold uppercase tracking-wider mb-1">How to play:</div>
                                <ul className="space-y-1.5 list-disc list-inside text-slate-300">
                                    <li>Read the sentence on the screen.</li>
                                    <li>Is it correct? Click <strong className="text-emerald-400">"✓ CORRECT"</strong>.</li>
                                    <li>Is there a mistake? Click <strong className="text-rose-400">"✗ HAS MISTAKE"</strong> and choose the correct word.</li>
                                    <li>Complete all <strong className="text-orange-300">10 sentences</strong> to see your final score and review.</li>
                                </ul>
                            </div>

                            {highScore > 0 && (
                                <div className="mb-5 bg-amber-500/10 border border-amber-500/30 text-amber-300 py-2 px-4 rounded-xl text-sm font-semibold flex items-center justify-center gap-2">
                                    <span>🏆 HIGH SCORE:</span>
                                    <span className="text-lg font-bold">{highScore} / {TOTAL_ROUNDS}</span>
                                </div>
                            )}

                            <button 
                                onClick={startMission} 
                                className="w-full py-4 bg-orange-500 hover:bg-orange-600 text-white transition-all text-lg font-bold font-orbitron tracking-wider rounded-xl shadow-lg cursor-pointer"
                            >
                                START INSPECTION
                            </button>
                        </div>
                    )}

                    {phase === 'GAME' && status === 'ACTIVE' && (
                        <div className="w-full max-w-4xl p-6 md:p-12 inspector-card rounded-3xl relative">
                            
                            <div className="flex justify-end items-center mb-8 gap-4 border-b border-slate-800 pb-6">
                                <div className="text-right">
                                    <div className="text-xs text-slate-400 uppercase tracking-widest mb-1">Progress</div>
                                    <div className="text-3xl md:text-4xl font-bold text-orange-400 font-orbitron">
                                        {currentIdx + 1}<span className="text-slate-500 text-xl">/{TOTAL_ROUNDS}</span>
                                    </div>
                                </div>
                            </div>

                            <div className="text-center mb-8 min-h-[140px] flex flex-col justify-center items-center">
                                <div className="text-xs uppercase tracking-widest text-orange-400 mb-2 font-semibold">
                                    {inspectStep === 'JUDGE' ? 'Step 1: Is this sentence grammatically correct?' : 'Step 2: Choose the correct quantifier'}
                                </div>
                                <div className="text-xl md:text-2xl font-bold text-white leading-snug max-w-2xl bg-slate-900/90 p-5 rounded-2xl border border-slate-800 shadow-inner">
                                    "{questions[currentIdx]?.text}"
                                </div>

                                {feedbackState && (
                                    <div className="mt-4">
                                        {feedbackState.type === 'CORRECT' ? (
                                            <span className="bg-emerald-950 border border-emerald-500 text-emerald-300 text-sm font-bold px-4 py-1.5 rounded-full uppercase tracking-wider shadow-lg">
                                                ✔ CORRECT!
                                            </span>
                                        ) : (
                                            <div className="bg-red-950 border border-red-500 text-red-200 text-sm font-bold px-4 py-2 rounded-xl uppercase tracking-wider shadow-lg">
                                                ✖ MISTAKE! ({feedbackState.detail})
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>

                            {inspectStep === 'JUDGE' && !feedbackState && (
                                <div className="flex gap-4 max-w-md mx-auto">
                                    <button
                                        onClick={() => handleUserJudge(true)}
                                        className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl font-orbitron tracking-wider transition-colors shadow-lg cursor-pointer"
                                    >
                                        ✓ CORRECT
                                    </button>
                                    <button
                                        onClick={() => handleUserJudge(false)}
                                        className="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-bold py-4 rounded-xl font-orbitron tracking-wider transition-colors shadow-lg cursor-pointer"
                                    >
                                        ✗ HAS MISTAKE
                                    </button>
                                </div>
                            )}

                            {inspectStep === 'FIX' && !feedbackState && (
                                <div className="space-y-3 max-w-md mx-auto">
                                    <div className="text-xs text-amber-400 text-center font-bold uppercase tracking-wider">Which quantifier belongs here?</div>
                                    <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                                        {options.map((opt) => (
                                            <button
                                                key={opt}
                                                onClick={() => handleFixSelection(opt)}
                                                className="action-btn bg-slate-800 border-2 border-slate-700 hover:border-orange-500 hover:bg-slate-700 text-slate-100 font-bold py-3 px-4 rounded-xl text-center text-sm tracking-wider transition-all cursor-pointer"
                                            >
                                                {opt}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {status === 'PASSED' && (
                        <div className="text-center p-6 md:p-10 inspector-card rounded-3xl max-w-2xl w-full my-8">
                            <div className="inline-block px-3 py-1 rounded-full uppercase tracking-widest mb-3 text-xs font-semibold bg-emerald-950 border border-emerald-500 text-emerald-400">
                                Inspection Completed
                            </div>

                            <h1 className="text-4xl md:text-5xl font-black mb-3 font-orbitron tracking-tighter text-white">
                                GREAT JOB!
                            </h1>
                            
                            <div className="flex justify-center gap-3 my-4 text-4xl">
                                {[1, 2, 3].map((star) => (
                                    <span 
                                        key={star} 
                                        className={`transition-all ${star <= calculateStars() ? 'text-amber-400 star-pop' : 'text-slate-700'}`}
                                        style={{ animationDelay: `${star * 0.2}s` }}
                                    >
                                        ★
                                    </span>
                                ))}
                            </div>

                            <p className="text-slate-300 mb-2 text-sm font-semibold">
                                Your score: <span className="text-orange-400 text-base">{score} / {TOTAL_ROUNDS}</span> correct
                            </p>
                            <p className="text-slate-400 mb-6 text-xs">
                                Review your inspection results below.
                            </p>

                            <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 mb-6 text-left max-h-60 overflow-y-auto">
                                <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 border-b border-slate-800 pb-2 flex justify-between">
                                    <span>Mistakes Review:</span>
                                    <span className="text-rose-400">{wrongAnswersList.length} mistake(s)</span>
                                </h3>

                                {wrongAnswersList.length === 0 ? (
                                    <div className="text-emerald-400 text-sm py-4 text-center font-semibold">
                                        🌟 No mistakes made! Top quality!
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        {wrongAnswersList.map((item, index) => (
                                            <div key={index} className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs">
                                                <div className="text-slate-200 font-medium mb-1">"{item.sentence}"</div>
                                                <div className="text-rose-400">Reason: {item.reason}</div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <button 
                                onClick={startMission}
                                className="w-full py-4 bg-orange-500 hover:bg-orange-600 text-white font-bold font-orbitron tracking-wider text-base rounded-xl transition-all shadow-lg cursor-pointer"
                            >
                                INSPECT AGAIN
                            </button>
                        </div>
                    )}
                </main>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
