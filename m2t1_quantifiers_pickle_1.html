<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngliForce Academy: Quantifiers Mission (10 Questions)</title>

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- EngliForce Fonts (Inclusief Fredoka voor duidelijke getallen) -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@600;700&family=Lexend:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --hero-orange-main: #ff7043;
            --hero-orange-dark: #e65c30;
            --hero-orange-glow: rgba(255, 112, 67, 0.4);
            --hero-yellow: #ffb703;
            --dark-bg: #0b1a2a;
            --card-bg: #102a43;
            --card-border: #243b53;
            --card-bg-done: #05101a;
            --hero-green: #22c55e;
            --hero-red: #ef4444;
        }

        body {
            font-family: 'Lexend', sans-serif;
            background: radial-gradient(circle at center, #102a43 0%, #05101a 100%);
            color: white;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Speciaal goed leesbaar lettertype voor cijfers */
        .num-font {
            font-family: 'Fredoka', 'Lexend', sans-serif;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* EngliForce Header */
        header.engliforce-header {
            background: var(--hero-orange-main);
            padding: 2.5rem 1rem;
            text-align: center;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);
            border-bottom: 5px solid var(--hero-yellow);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            color: white;
            position: relative;
            z-index: 10;
        }

        header.engliforce-header h1 { 
            font-family: 'Bangers', cursive; 
            font-size: 3.5rem; 
            letter-spacing: 3px; 
            margin: 0; 
            text-shadow: 4px 4px 0px var(--hero-orange-dark); 
        }

        header.engliforce-header p { 
            font-size: 1.2rem; 
            font-weight: bold; 
            margin-top: 5px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }

        /* Card / Quiz Area */
        .quiz-card {
            background: var(--card-bg);
            border: 3px solid var(--card-border);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            position: relative;
        }

        .section-title { 
            font-family: 'Bangers', cursive; 
            font-size: 2.8rem; 
            color: var(--hero-orange-main); 
            margin: 0 0 15px 0; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            text-align: center; 
        }

        /* Action Buttons */
        .btn-action {
            background: var(--hero-orange-main);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Bangers', cursive;
            font-size: 1.8rem;
            letter-spacing: 1.5px;
            transition: 0.2s;
            box-shadow: 0 5px 0 var(--hero-orange-dark);
            text-transform: uppercase;
        }

        .btn-action:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 7px 0 var(--hero-orange-dark); 
        }

        .btn-action:active { 
            transform: translateY(4px); 
            box-shadow: none; 
        }

        .btn-green {
            background: var(--hero-green);
            box-shadow: 0 5px 0 #15803d;
        }
        .btn-green:hover {
            box-shadow: 0 7px 0 #15803d;
        }

        /* Input Field */
        .wire-input {
            background: rgba(0, 0, 0, 0.3);
            border: none;
            border-bottom: 3px solid var(--hero-orange-main);
            outline: none;
            min-width: 150px;
            text-align: center;
            color: var(--hero-yellow);
            font-weight: bold;
            font-size: 1.6rem;
            transition: all 0.2s;
            padding: 0 10px;
            margin: 0 8px;
            font-family: 'Lexend', sans-serif;
            border-radius: 6px 6px 0 0;
        }
        
        .wire-input:focus {
            border-bottom-color: var(--hero-yellow);
            background: rgba(255, 255, 255, 0.1);
        }

        .wire-input.correct {
            border-bottom-color: var(--hero-green);
            color: var(--hero-green);
        }

        .wire-input.wrong {
            border-bottom-color: var(--hero-red);
            color: var(--hero-red);
        }

        .feedback-box {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--hero-orange-main);
            border-radius: 10px;
        }
    </style>
</head>

                setWrongAnswers([]);

                    if (prevScore > highScore) {

                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },

                });

                if (feedback) {

                    return;

                const trimmed = input.toLowerCase().trim();
                if (!trimmed) return;

                    setFeedback({

                        userAnswer: trimmed,
                        correctAnswer: currentQ.ans
                    });

                        userAnswer: trimmed
                    };

                        isCorrect: false,
                        userAnswer: trimmed,
                        correctAnswer: currentQ.ans
                    });

                    finishGame();

                        {phase === 'START' && (
                            <div className="quiz-card p-8 md:p-12 max-w-2xl w-full text-center">

                                <p className="text-gray-300 mb-6 text-lg leading-relaxed font-light">
                                    Oefen met <span className="text-yellow-400 font-semibold">much, many, little, few, a little</span> en <span className="text-yellow-400 font-semibold">a few</span>!
                                </p>
                                <div className="bg-black/20 p-5 rounded-xl text-left text-sm text-gray-300 mb-8 border border-white/10 space-y-2">
                                    <p>🎯 <strong>10 Vragen per ronde:</strong> Telkens 10 willekeurige vragen uit de 150-vragenbank.</p>

                                </div>

                                    START MISSION

                            </div>
                        )}

                        {/* GAME SCHERM */}
                        {phase === 'GAME' && questions.length > 0 && (
                            <div className="quiz-card p-6 md:p-10 max-w-4xl w-full">
                                
                                {/* TOP BAR */}
                                <div className="flex justify-between items-center mb-8 border-b border-gray-700 pb-4">
                                    <div className="text-left">
                                        <div className="text-xs text-gray-400 font-bold uppercase tracking-wider">Vraag</div>
                                        <div className="text-3xl font-bold text-white num-font">
                                            {currentIdx + 1} / {questions.length}
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <div className="text-xs text-gray-400 font-bold uppercase tracking-wider">Score</div>
                                        <div className="text-3xl font-black text-yellow-400 num-font">{score}</div>
                                    </div>
                                </div>

                                {/* VRAGEN FORMULIER */}
                                <form onSubmit={handleSubmit} className="text-center py-6">
                                    <div className="text-xl md:text-2xl font-light text-white leading-loose mb-8">
                                        {questions[currentIdx].start}
                                        <input 
                                            ref={inputRef}
                                            className={`wire-input ${feedback ? (feedback.isCorrect ? 'correct' : 'wrong') : ''}`}
                                            value={input}
                                            onChange={(e) => setInput(e.target.value)}
                                            disabled={feedback !== null}
                                            autoFocus
                                            spellCheck="false"
                                            autoComplete="off"
                                            placeholder="..."
                                        />
                                        {questions[currentIdx].end}
                                    </div>

                                    {/* FEEDBACK MELDING */}
                                    {feedback && (
                                        <div className="feedback-box mb-8">
                                            {feedback.isCorrect ? (
                                                <div className="inline-block bg-green-500/20 border-2 border-green-500 text-green-400 px-6 py-3 rounded-xl font-bold text-lg">
                                                    🎉 GOED GEDAAN! (+10 punten)
                                                </div>
                                            ) : (
                                                <div className="inline-block bg-red-500/20 border-2 border-red-500 text-red-400 px-6 py-3 rounded-xl text-lg font-medium">
                                                    ❌ <strong>FOUT!</strong> Het juiste antwoord is: <span className="underline font-bold text-yellow-300">{feedback.correctAnswer}</span>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* KNOPPEN */}
                                    {!feedback ? (
                                        <button type="submit" className="btn-action">
                                            CONTROLEER
                                        </button>
                                    ) : (
                                        <button type="button" onClick={nextQuestion} className="btn-action btn-green">
                                            {currentIdx + 1 >= questions.length ? 'BEKIJK RESULTATEN ➔' : 'VOLGENDE VRAAG ➔'}
                                        </button>
                                    )}
                                </form>

                                {/* VOORTGANGSBALK */}
                                <div className="mt-8 h-2 w-full bg-gray-800 rounded-full overflow-hidden">
                                    <div 
                                        className="h-full bg-orange-500 transition-all duration-300" 
                                        style={{width: `${((currentIdx + 1) / questions.length) * 100}%`}}>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* EIND SCHERM / RESULTATEN OVERZICHT */}
                        {phase === 'END' && (
                            <div className="quiz-card p-6 md:p-10 max-w-4xl w-full my-6">
                                <h1 className="section-title">MISSION COMPLETED!</h1>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                                    <div className="bg-black/30 p-6 rounded-xl text-center border border-white/10">
                                        <div className="text-xs text-gray-400 font-bold uppercase tracking-wider mb-1">Eindscore</div>
                                        <div className="text-5xl font-black text-yellow-400 num-font">{score}</div>
                                    </div>
                                    <div className="bg-black/30 p-6 rounded-xl text-center border border-white/10">
                                        <div className="text-xs text-gray-400 font-bold uppercase tracking-wider mb-1">Aantal Fouten</div>
                                        <div className="text-5xl font-black text-white num-font">
                                            {wrongAnswers.length} / {questions.length}
                                        </div>
                                    </div>
                                </div>

                                {/* FOUTE ANTWOORDEN OVERZICHT */}
                                <div className="mb-8">
                                    <h3 className="text-xl font-bold mb-4 text-orange-400 uppercase tracking-wider flex items-center gap-2">
                                        🔍 Overzicht foute antwoorden
                                    </h3>

                                    {wrongAnswers.length === 0 ? (
                                        <div className="bg-green-500/10 border border-green-500/40 p-6 rounded-xl text-center text-green-400 font-bold">
                                            🏆 Perfect! Geen enkele fout gemaakt!
                                        </div>
                                    ) : (
                                        <div className="space-y-3 max-h-96 overflow-y-auto pr-2 custom-scrollbar">
                                            {wrongAnswers.map((item, idx) => (
                                                <div key={idx} className="bg-black/40 border border-red-500/30 p-4 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                                    <div className="text-gray-200 text-sm leading-relaxed">
                                                        <span>{item.start} </span>
                                                        <span className="font-bold text-green-400 underline decoration-2">{item.ans}</span>
                                                        <span> {item.end}</span>
                                                    </div>
                                                    <div className="flex gap-2 text-xs font-semibold whitespace-nowrap">
                                                        <span className="bg-red-500/20 text-red-400 px-3 py-1 rounded border border-red-500/40">
                                                            Jouw antwoord: {item.userAnswer || "(blanco)"}
                                                        </span>
                                                        <span className="bg-green-500/20 text-green-400 px-3 py-1 rounded border border-green-500/40">
                                                            Juist: {item.ans}
                                                        </span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div className="text-center">
                                    <button onClick={startGame} className="btn-action">
                                        SPEEL OPNIEUW (NIEUWE 10 VRAGEN)
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* ENGLIFORCE FOOTER */}
                    <footer>
                        <p style={{textAlign: 'center', opacity: 0.5, padding: '30px 0', fontSize: '0.9rem'}}>
                            &copy; 2026 EngliForce – Make English Your Superpower!
                        </p>
                    </footer>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
