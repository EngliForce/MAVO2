<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngliForce Academy - Past Simple Hero ⏳</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Lexend:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --hero-orange-main: #ff7043;
            --hero-orange-dark: #e65c30;
            --hero-orange-glow: rgba(255, 112, 67, 0.4);
            --hero-yellow: #ffb703;
            --dark-bg: #0b1a2a;
            --card-bg: #102a43;
            --card-border: #243b53;
            --card-bg-done: #05101a;
            --wrong-red: #ef4444;
            --correct-green: #22c55e;
        }

        body {
            font-family: 'Lexend', sans-serif;
            background: radial-gradient(circle at center, #102a43 0%, #05101a 100%);
            color: white;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--hero-orange-main);
            padding: 2.5rem 1rem;
            text-align: center;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);
            border-bottom: 5px solid var(--hero-yellow);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            color: white;
        }

        h1 { 
            font-family: 'Bangers', cursive; 
            font-size: 3.5rem; 
            letter-spacing: 3px; 
            margin: 0; 
            text-shadow: 4px 4px 0px var(--hero-orange-dark); 
        }

        header p { 
            font-size: 1.2rem; 
            font-weight: bold; 
            margin-top: 5px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }

        main { 
            flex: 1;
            max-width: 650px; 
            width: 90%;
            margin: 40px auto; 
            padding: 20px; 
            box-sizing: border-box;
        }

        .panel { 
            background: var(--card-bg); 
            padding: 40px; 
            border-radius: 20px; 
            border: 3px solid var(--card-border);
            text-align: center; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
        }

        .panel h2 {
            font-family: 'Bangers', cursive;
            font-size: 2rem;
            color: var(--hero-yellow);
            letter-spacing: 1px;
            margin-top: 0;
        }

        .toggle-wrapper { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin: 15px 0; 
            padding: 10px 0; 
            border-bottom: 1px solid var(--card-border); 
            font-size: 1.1rem;
        }

        .switch { position: relative; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        
        .slider { 
            position: absolute; 
            cursor: pointer; 
            top: 0; left: 0; right: 0; bottom: 0; 
            background: var(--card-border); 
            transition: .4s; 
            border-radius: 34px; 
        }

        .slider:before { 
            position: absolute; 
            content: ""; 
            height: 20px; 
            width: 20px; 
            left: 3px; 
            bottom: 3px; 
            background: white; 
            border-radius: 50%; 
            transition: .4s; 
        }

        input:checked + .slider { background: var(--hero-orange-main); }
        input:checked + .slider:before { transform: translateX(24px); }

        .sentence { 
            font-size: 1.3rem; 
            margin: 30px 0; 
            color: #f8fafc; 
            font-weight: bold; 
            min-height: 60px; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        input[type="text"] { 
            padding: 15px; 
            font-size: 1.1rem; 
            font-family: 'Lexend', sans-serif;
            border-radius: 12px; 
            border: 2px solid var(--card-border); 
            width: 80%; 
            background: var(--dark-bg); 
            color: white; 
            text-align: center; 
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--hero-orange-main);
        }

        .btn { 
            background: var(--hero-orange-main); 
            color: white; 
            border: none; 
            padding: 15px 40px; 
            border-radius: 50px; 
            font-family: 'Bangers', cursive;
            font-size: 1.4rem; 
            letter-spacing: 1px;
            cursor: pointer; 
            margin-top: 20px; 
            transition: 0.3s; 
            box-shadow: 0 4px 15px rgba(255, 112, 67, 0.4);
        }

        .btn:hover { 
            background: var(--hero-orange-dark); 
            transform: translateY(-2px);
        }

        .hidden { display: none; }
        #badge { font-size: 80px; display: none; animation: spin 4s linear infinite; }
        #status { color: var(--hero-yellow); font-weight: bold; font-size: 1.1rem; }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .recap-container {
            margin-top: 20px;
            text-align: left;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .recap-item {
            background: var(--dark-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }
        .recap-q { font-weight: bold; margin-bottom: 5px; color: #f8fafc; }
        .recap-given { color: var(--wrong-red); }
        .recap-correct { color: var(--correct-green); font-weight: bold; }

        footer {
            text-align: center; 
            opacity: 0.5; 
            padding: 40px 0 20px 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>ENGLIFORCE ACADEMY</h1>
        <p>PAST SIMPLE HERO ⏳</p>
    </header>

    <main>
        <div class="panel">
            <div id="start">
                <h2>Wat wil je oefenen?</h2>
                <div class="toggle-wrapper">
                    <span>Bevestigen</span> 
                    <label class="switch"><input type="checkbox" class="cat" value="pos" checked><span class="slider"></span></label>
                </div>
                <div class="toggle-wrapper">
                    <span>Ontkennen</span> 
                    <label class="switch"><input type="checkbox" class="cat" value="neg"><span class="slider"></span></label>
                </div>
                <div class="toggle-wrapper">
                    <span>Vragen</span> 
                    <label class="switch"><input type="checkbox" class="cat" value="que"><span class="slider"></span></label>
                </div>
                <button class="btn" onclick="start()">START QUEST</button>
            </div>

            <div id="quiz" class="hidden">
                <div id="status">Vraag 1/10</div>
                <div class="sentence" id="sentence">---</div>
                <input type="text" id="answer" placeholder="Typ je antwoord..." autocomplete="off" onkeypress="handleKeyPress(event)">
                <br><button class="btn" onclick="check()">CHECK</button>
            </div>

            <div id="end" class="hidden">
                <div id="badge">⏳</div>
                <h2 id="msg"></h2>
                <div id="recap" class="recap-container hidden"></div>
                <button class="btn" onclick="location.reload()">OPNIEUW</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 EngliForce – Make English Your Superpower!</p>
    </footer>

    <script>

    let q = [], i = 0, score = 0;
    let mistakes = [];

    function start() {
        let active = Array.from(document.querySelectorAll('.cat')).filter(c => c.checked).map(c => c.value);
        if(!active.length) return alert("Kies minimaal 1 categorie!");
        
        q = [];
        mistakes = [];
        active.forEach(c => q.push(...db[c]));
        q = q.sort(() => 0.5 - Math.random()).slice(0, 10);
        
        document.getElementById('start').classList.add('hidden');
        document.getElementById('quiz').classList.remove('hidden');
        show();
    }

    function show() {
        document.getElementById('status').innerText = `Vraag ${i + 1}/10`;
        document.getElementById('sentence').innerText = q[i].s;
        document.getElementById('answer').value = "";
        document.getElementById('answer').focus();
    }

    function handleKeyPress(e) {
        if (e.key === "Enter") {
            check();
        }
    }

    function check() {
        let val = document.getElementById('answer').value.toLowerCase().trim();
        let correct = q[i].a;

        if (val === correct) {
            score++;
        } else {
            mistakes.push({
                question: q[i].s,
                given: val === "" ? "(Niets ingevuld)" : val,
                correct: correct
            });
        }

        if (++i < 10) {
            show();
        } else {
            document.getElementById('quiz').classList.add('hidden');
            document.getElementById('end').classList.remove('hidden');
            
            if(score === 10) {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#ff7043', '#ffb703', '#ffffff'] });

                document.getElementById('msg').innerHTML = "LEGENDARY! <br>Time Traveler Badge behaald!";

                document.getElementById('msg').innerText = `Score: ${score}/10. Haal 10/10 voor de badge!`;

                recapDiv.innerHTML = "<h3>Recap van je fouten:</h3>";
                mistakes.forEach(m => {
                    recapDiv.innerHTML += `
                        <div class="recap-item">
                            <div class="recap-q">${m.question}</div>
                            <div>Jouw antwoord: <span class="recap-given">${m.given}</span></div>
                            <div>Juiste antwoord: <span class="recap-correct">${m.correct}</span></div>
                        </div>
                    `;
                });
                recapDiv.classList.remove('hidden');
            }
        }
    }
